[project]
name = "telegrambot"
version = "2023.9.1"
description = "Telegram bot"
authors = [
    { name = "Oleg A.", email = "t0rr@mail.ru" },
]
# <3.15: aiogram 3.31 does not support Python 3.15 yet.
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiogram>=3.31,<4",
    # magic-filter is imported directly (RegexpMode), not only via aiogram.
    "magic-filter>=1.0.12,<2",
    "pydantic>=2.13.5,<3",
    "uvloop>=0.22,<0.23 ; sys_platform != 'win32' and implementation_name == 'cpython'",
    "backoff>=2.2,<2.3",
    "pydantic-settings>=2.2.1,<3",
    "yatracker>=2026.9,<2027",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    "pytest-aiohttp>=1.1,<2",
    "ruff>=0.16,<0.17",
]

[tool.uv]
# The app runs as `python -m app` from the repo root; it is not an installable package.
package = false

[tool.mypy]
follow_imports = "silent"
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
pretty = true

plugins = [
  "pydantic.mypy"
]


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[[tool.mypy.overrides]]
module = "*.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true


[tool.ruff]
src = ["app", "tools", "tests"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Assume Python 3.11.
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
# COM812 is ignored because it conflicts with the ruff formatter.
ignore = ["ANN401", "COM812", "CPY001", "D100", "D101", "D106", "D107", "D104", "D203", "D213", "RUF001", "RUF002", "RUF003", "S101", "PT015", "PT017", "B011"]
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001"]
"tools/*" = ["INP001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
